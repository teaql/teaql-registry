name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # Generated runtime registration currently exceeds Rust/Tokio's small
  # default test-thread stack. Keep this explicit until the generator emits a
  # flatter registration path.
  RUST_MIN_STACK: 16777216
  TOKIO_WORKER_STACK_SIZE: 16777216

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check generated domain library
        run: cargo check -p teaql-registry-service-core --all-targets
      - name: Check application formatting
        run: cargo fmt -p teaql-registry -p registry-tui -- --check
      - name: Lint application-owned code
        # Axum's Response is intentionally returned directly from HTTP boundary
        # helpers; boxing it would complicate handlers without reducing runtime
        # allocations. Rust 1.99 started flagging this shape by default.
        run: cargo clippy -p teaql-registry -p registry-tui --all-targets --no-deps -- -D warnings -A clippy::result_large_err

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9010:9000
    env:
      TEAQL_REGISTRY_SERVICE_CORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_db
      TEAQL_REGISTRY_SERVICE_CORE_DATABASE_USER: postgres
      TEAQL_REGISTRY_SERVICE_CORE_DATABASE_PASSWORD: postgres
      S3_ENDPOINT: http://127.0.0.1:9010
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_BUCKET: teaql-blobs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        shell: bash
        run: |
          mkdir -p ci-evidence
          {
            echo "git_commit=${GITHUB_SHA}"
            echo "recorded_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "postgres_image=postgres:16-alpine"
            echo "rustfs_image=rustfs/rustfs:latest"
          } > ci-evidence/environment.txt
          set -o pipefail
          cargo test --workspace -- --test-threads=1 2>&1 | tee ci-evidence/test-output.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: warn
