[package]
name = "teaql-registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "High-performance extensible artifact and package registry service powered by TeaQL"
license = "MIT OR Apache-2.0"

[[bin]]
name = "teaql-registry"
path = "src/main.rs"

[dependencies]
teaql_registry_core = { package = "teaql-registry-core", path = "../rust-lib-core/lib" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
teaql-core = "4.2.12"
teaql-runtime = "4.2.12"
teaql-data-service = "4.2.12"
teaql-provider-postgres = "4.2.12"
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
quick-xml = { version = "0.36", features = ["serialize"] }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
futures-util = "0.3"
bytes = "1.6"
http = "1.1"
regex = "1.10"
hmac = "0.12.1"

[dev-dependencies]
tempfile = "3.10"
