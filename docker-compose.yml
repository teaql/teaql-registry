services:
  teaql-registry:
    build:
      context: .
      dockerfile: Dockerfile
    image: teaql/teaql-registry:latest
    container_name: teaql-registry
    ports:
      - "8081:8081"
    environment:
      - TEAQL_REGISTRY_SERVICE_CORE_DATABASE_URL=postgresql://${POSTGRES_USER:-teaql_registry}:${POSTGRES_PASSWORD:-teaql_registry_dev}@postgres:5432/${POSTGRES_DB:-teaql_registry_db}
      - TEAQL_REGISTRY_SERVICE_CORE_DATABASE_USER=${POSTGRES_USER:-teaql_registry}
      - TEAQL_REGISTRY_SERVICE_CORE_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-teaql_registry_dev}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://rustfs:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-teaql-registry}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-teaql-registry-dev}
      - S3_BUCKET=${S3_BUCKET:-teaql-blobs}
      - S3_REGION=${S3_REGION:-us-east-1}
      - CREDENTIALS_DIR=/var/lib/teaql-registry/credentials
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PORT=${PORT:-8081}
      - RUST_LOG=${RUST_LOG:-info}
      - ALLOW_ANONYMOUS_READ=${ALLOW_ANONYMOUS_READ:-false}
    volumes:
      - registry_credentials:/var/lib/teaql-registry/credentials
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: teaql-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-teaql_registry}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-teaql_registry_dev}
      - POSTGRES_DB=${POSTGRES_DB:-teaql_registry_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: teaql-rustfs
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-teaql-registry}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:-teaql-registry-dev}
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  rustfs_data:
  registry_credentials:
