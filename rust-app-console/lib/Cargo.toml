
[package]
name = "nexus-repository-service-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Generated TeaQL service crate for nexus-repository-service"
license = "MIT OR Apache-2.0"

[dependencies]
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
futures-util = "0.3"
teaql-core = "4.2.11"
teaql-macros = "4.2.11"
teaql-runtime = "4.2.11"
teaql-sql = "4.2.11"
teaql-data-service = "4.2.11"
teaql-tool-core = "1.0.0"
teaql-provider-postgres = "4.2.11"
tokio-postgres = { version = "0.7" }
deadpool-postgres = { version = "0.14.0", features = ["rt_tokio_1"] }
deadpool = "0.12"
tokio-util = "0.7"
deadpool-runtime = "0.1.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
